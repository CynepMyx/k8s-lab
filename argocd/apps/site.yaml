apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: site
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CynepMyx/k8s-lab.git
    targetRevision: main
    path: apps/site
    helm:
      releaseName: site
      valuesObject:
        message: "Changed via helm upgrade"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
